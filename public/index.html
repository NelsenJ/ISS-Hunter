<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>ISS Hunter — Tebak Posisi ISS</title>
    <meta
      name="description"
      content="Game web tebak posisi Stasiun Luar Angkasa Internasional beberapa menit ke depan."
    />
    <script src="/js/theme-boot.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Leaflet CSS dengan SRI integrity -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <!-- Leaflet JS dengan SRI integrity -->
    <script
      src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
      crossorigin="anonymous"
    ></script>
    <!-- Supabase JS UMD dengan SRI integrity -->
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"
      integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="ISS Hunter">ISS Hunter</a>
      <div class="header-actions">
        <div
          id="header-player-info"
          style="display: inline-flex; align-items: center; gap: var(--space-2)"
        ></div>
        <div id="server-status" class="status-pill" role="status">
          <span class="status-dot" data-state="checking" aria-hidden="true"></span>
          <span id="server-status-text">Memeriksa…</span>
        </div>
        <button type="button" id="theme-toggle-btn" class="btn btn-ghost" aria-label="Ganti tema">
          <span class="theme-label">Tema</span>
        </button>
      </div>
      <div class="header-progress-bar" aria-hidden="true">
        <div id="header-progress-fill" class="header-progress-fill" style="width: 0%"></div>
      </div>
    </header>

    <main id="app-container" class="main-content">
      <div class="page-container">
        <div class="panel">
          <p style="color: var(--text-secondary)">Memuat aplikasi…</p>
        </div>
      </div>
    </main>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
